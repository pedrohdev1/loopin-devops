services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: loopin-backend:local
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongodb:27017/loopin
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env antes de iniciar}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      APP_BOOTSTRAP_TOKEN: ${APP_BOOTSTRAP_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - loopin-network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: loopin
    volumes:
      - mongodb_data:/data/db
    networks:
      - loopin-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongodb_data:
    name: loopin-devops-mongodb-data

networks:
  loopin-network:
    name: loopin-devops-network
    driver: bridge
